apiVersion: v1
kind: Secret
metadata:
  name: chatflow-secrets
type: Opaque
# Local/dev values. In a real cluster, replace via a sealed-secret / external secret manager.
stringData:
  JWT_SECRET: change-me-in-production-must-be-at-least-32-chars
  INTERNAL_TOKEN: dev-internal-token
  DB_USERNAME: chatflow
  DB_PASSWORD: chatflow
  AI_DB_USERNAME: chatflow
  AI_DB_PASSWORD: chatflow
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  AI_EMBEDDING_API_KEY: ""
  ANTHROPIC_API_KEY: ""
