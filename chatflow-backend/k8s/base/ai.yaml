apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels: { app: ai }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai } }
  template:
    metadata: { labels: { app: ai } }
    spec:
      containers:
        - name: ai
          image: chatflow-ai:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          envFrom:
            - secretRef: { name: chatflow-secrets }
          env:
            - { name: AI_DB_URL, value: jdbc:postgresql://postgres-ai:5432/chatflow_ai }
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092 }
            - { name: CORE_BASE_URL, value: http://core:8080 }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://jaeger:4318/v1/traces }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector: { app: ai }
  ports: [{ port: 8081, targetPort: 8081 }]
