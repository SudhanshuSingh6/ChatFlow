spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatflow
    username: ${DB_USERNAME:chatflow}
    password: ${DB_PASSWORD:chatflow}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
    expiration-ms: 86400000
  presence:
    heartbeat-interval-ms: 30000
  websocket:
    idle-timeout-seconds: 90
    ping-interval-seconds: 30
    ping-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      app: chatflow
    distribution:
      # Enables histogram buckets for p50/p95/p99 on the delivery timer.
      # Without this, only mean and max are available.
      percentiles-histogram:
        chatflow.messages.delivery.latency: true
      percentiles:
        chatflow.messages.delivery.latency: 0.5, 0.95, 0.99

  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    base-url: ${MEDIA_BASE_URL:http://localhost:8080/media}
    thumbnail:
      width: 320
      height: 320
      quality: 0.8
    processing:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100

  s3:
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:chatflow}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    presigned-url-expiry-minutes: 60

  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    base-url: ${MEDIA_BASE_URL:http://localhost:8080/media}
    max-file-size-bytes:
      IMAGE: 10485760    # 10 MB
      VIDEO: 104857600   # 100 MB
      AUDIO: 20971520    # 20 MB
      FILE:  52428800    # 50 MB
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}