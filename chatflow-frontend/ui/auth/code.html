<body class="bg-background text-on-background flex flex-col h-full font-body-md text-body-md">
<!-- TopNavBar (Suppressed due to Linear/Transactional Intent as per Semantic Shell Mandate) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden bg-gradient-to-br from-surface-container-lowest to-surface-container-low">
<!-- Background decorative elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-30">
<div class="absolute -top-40 -left-40 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
<div class="absolute top-40 -right-40 w-96 h-96 bg-secondary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
<div class="absolute -bottom-40 left-20 w-96 h-96 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-4000"></div>
</div>
<div class="relative z-10 w-full max-w-[440px]">
<!-- Brand Identity -->
<div class="text-center mb-8">
<img src="https://lh3.googleusercontent.com/aida/AP1WRLsX02TlkpaJa0guBBo83EtqAvQK1XLsuSttZ8gcxyqgQtamVoXdsiwK2dG87heaol5P4_AnOyAybKrbZ6uMxMb8Otg7l69o8rCBZMY758181Y7lChRY0b8PAaP24jzIwk_C_5s64__Y6ZMcUSerIRAuLsVHXvbU8jMlBL7B72tASkZDULsg1aYg3FVdiGsRozRxmBVoFGjrT3GjmPhupmgQEW228JOh3Mr2eIXGI0ZVns6rjQs6lsY0Gg" alt="Chatflow Logo" class="h-12 w-12 mx-auto mb-4"><h1 class="font-display text-display text-primary tracking-tight">Chatflow</h1>
<p class="font-body-lg text-body-lg text-secondary mt-2">Sign in to continue to your workspace.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_10px_15px_-3px_rgba(80,95,118,0.1)] border border-outline-variant p-8 w-full">
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">person</span>
<input class="w-full pl-10 pr-4 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-fixed-dim/30 transition-all duration-200" id="username" name="username" placeholder="Enter your username" type="text">
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full pl-10 pr-10 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary-fixed-dim/30 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-secondary" for="remember-me">Remember me for 30 days</label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md h-10 rounded-lg flex items-center justify-center transition-all duration-200 active:shadow-inner" type="submit">
                        Sign In
                    </button>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-body-sm text-body-sm text-secondary">Or continue with</span>
</div>
</div>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="ml-2 font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center px-4 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 group">

<span class="ml-2 font-label-md text-label-md text-on-surface">Apple</span>

<style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
